# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python Test

on:
  push:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install setuptools wheel 'versioneer[toml]' flake8 ruff pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        python -m pip install --user --no-build-isolation .
    - name: Lint with ruff and flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        ruff check ./array_split
        flake8 ./array_split --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 ./array_split --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test
      shell: bash
      run: |
        cd ~
        python -m array_split.tests -fv

